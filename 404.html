<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dkn.su // 404</title>

    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/error.css">

    <!-- Встроенные стили, чтобы страница гарантированно отображалась при любой глубине пути (например, /a/b/c) -->
    <style>
        :root {
            --bg-color: #080c14;
            --accent-color: #38bdf8;
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px);
            background-size: 44px 44px;
            animation: move-background 18s linear infinite;
            pointer-events: none;
        }

        .background::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 15%, rgba(8, 12, 20, 0.92) 85%);
        }

        @keyframes move-background {
            0% { background-position: 0 0; }
            100% { background-position: 44px 44px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .background {
                animation: none;
            }
        }

        .content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-size: clamp(6rem, 16vw, 12rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.06em;
            color: var(--text-primary);
            margin-bottom: 1rem;
            user-select: none;
            text-shadow: 0 0 50px rgba(56, 189, 248, 0.15);
        }

        .error-code span {
            color: var(--accent-color);
        }

        .error-message {
            font-size: 1.15rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-bottom: 1rem;
            max-width: 520px;
        }

        .error-message i {
            font-style: italic;
        }

        .missing-path {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
        }

        .missing-path span {
            color: var(--accent-color);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="content">
        <h1 class="error-code">40<span>4</span></h1>
        <p class="error-message"><i>страница не найдена, либо еще не создана</i></p>
        <div id="missing-path" class="missing-path" style="display: none;">
            [запрошен: <span id="path-val"></span>]
        </div>
        <a href="/" class="back-link">
            <i class="bi bi-arrow-left"></i>
            <span>вернуться на dkn.su</span>
        </a>
    </div>
    <script>
        const path = window.location.pathname;
        if (path && path !== '/' && path !== '/404' && path !== '/404.html') {
            const el = document.getElementById('missing-path');
            const val = document.getElementById('path-val');
            if (el && val) {
                val.textContent = path;
                el.style.display = 'inline-block';
            }
        }
    </script>
</body>
</html>
