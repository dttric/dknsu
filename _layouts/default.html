<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "dkn.su // blog" }}</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Fonts (Google Fonts with full Cyrillic support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Styles (Root-relative paths for any domain / subdomain) -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/blog.css">
</head>
<body class="blog-body">
    <div id="animated-bg" aria-hidden="true"></div>

    <header class="blog-header font-monospace">
        <div class="container d-flex justify-content-between align-items-center py-4">
            <a href="/" class="brand-link">
                <span class="brand-name">dkn</span><span class="brand-dot">.su</span>
                <span class="badge bg-secondary-subtle text-secondary ms-2">publications</span>
            </a>
            <nav class="blog-nav">
                <a href="/" class="nav-back"><i class="bi bi-arrow-left"></i> на главную</a>
            </nav>
        </div>
    </header>

    <main class="container blog-main py-4">
        {{ content }}
    </main>

    <footer class="blog-footer font-monospace text-center py-5 text-muted">
        <small>dkn.su // {{ site.time | date: '%Y' | default: '2026' }}</small>
    </footer>
</body>
</html>
